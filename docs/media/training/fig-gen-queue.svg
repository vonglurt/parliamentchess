<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"><title>The Orrery queue</title><rect width="1320" height="520" fill="#fcfcfb"/><text x="40.0" y="46.0" font-size="24" fill="#0b0b0b" text-anchor="start" font-weight="650" >One generation through the Orrery queue</text><text x="40.0" y="74.0" font-size="15" fill="#52514e" text-anchor="start" font-weight="400" >The planner adds the jobs; the fleet&#x27;s lanes take them. Medians over 24 generations: 42 minutes from first job to verdict.</text><rect x="40" y="150" width="190" height="150" rx="12" fill="#fcfcfb" stroke="#c9c8c2" stroke-width="1.5"/><rect x="40" y="150" width="190" height="8" rx="4" fill="#c9c8c2"/><text x="56.0" y="188.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="650" >plan.json</text><text x="56.0" y="216.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >the generations to run,</text><text x="56.0" y="238.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >throttle, the election bar</text><rect x="250" y="150" width="190" height="150" rx="12" fill="#fcfcfb" stroke="#c9c8c2" stroke-width="1.5"/><rect x="250" y="150" width="190" height="8" rx="4" fill="#c9c8c2"/><text x="266.0" y="188.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="650" >pc-prep</text><text x="266.0" y="216.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >once per lane and version:</text><text x="266.0" y="238.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >git archive HEAD, tests,</text><text x="266.0" y="260.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >Rust build, PyTorch venv</text><rect x="460" y="150" width="190" height="150" rx="12" fill="#fcfcfb" stroke="#2a78d6" stroke-width="3"/><rect x="460" y="150" width="190" height="8" rx="4" fill="#2a78d6"/><text x="476.0" y="188.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="650" >pc-label  x30</text><text x="476.0" y="216.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >CPU lanes: a 3-ply teacher</text><text x="476.0" y="238.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >labels ~70k positions</text><text x="476.0" y="260.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="650" >73 lane-min</text><rect x="670" y="150" width="190" height="150" rx="12" fill="#fcfcfb" stroke="#eb6834" stroke-width="3"/><rect x="670" y="150" width="190" height="8" rx="4" fill="#eb6834"/><text x="686.0" y="188.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="650" >pc-train  x1</text><text x="686.0" y="216.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >a GPU lane (GTX 1080 Ti):</text><text x="686.0" y="238.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >PyTorch, early stopping</text><text x="686.0" y="260.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="650" >4.6 lane-min</text><rect x="880" y="150" width="190" height="150" rx="12" fill="#fcfcfb" stroke="#1baf7a" stroke-width="3"/><rect x="880" y="150" width="190" height="8" rx="4" fill="#1baf7a"/><text x="896.0" y="188.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="650" >pc-gauntlet</text><text x="896.0" y="216.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >CPU lanes: 200 games,</text><text x="896.0" y="238.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >challenger vs champion</text><text x="896.0" y="260.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="650" >16 lane-min</text><rect x="1090" y="150" width="190" height="150" rx="12" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="3"/><rect x="1090" y="150" width="190" height="8" rx="4" fill="#0b0b0b"/><text x="1106.0" y="188.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="650" >the verdict</text><text x="1106.0" y="216.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >elected if z &gt; 2 and it</text><text x="1106.0" y="238.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >holds an election; then</text><text x="1106.0" y="260.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="400" >commit + push to main</text><line x1="234" x2="240" y1="225.0" y2="225.0" stroke="#52514e" stroke-width="2"/><path d="M238,219.0 L248,225.0 L238,231.0 Z" fill="#52514e"/><line x1="444" x2="450" y1="225.0" y2="225.0" stroke="#52514e" stroke-width="2"/><path d="M448,219.0 L458,225.0 L448,231.0 Z" fill="#52514e"/><line x1="654" x2="660" y1="225.0" y2="225.0" stroke="#52514e" stroke-width="2"/><path d="M658,219.0 L668,225.0 L658,231.0 Z" fill="#52514e"/><line x1="864" x2="870" y1="225.0" y2="225.0" stroke="#52514e" stroke-width="2"/><path d="M868,219.0 L878,225.0 L868,231.0 Z" fill="#52514e"/><line x1="1074" x2="1080" y1="225.0" y2="225.0" stroke="#52514e" stroke-width="2"/><path d="M1078,219.0 L1088,225.0 L1078,231.0 Z" fill="#52514e"/><path d="M1185.0,304 L1185.0,360 L555.0,360 L555.0,312" fill="none" stroke="#52514e" stroke-width="2" stroke-dasharray="7 5"/><path d="M549.0,316 L555.0,304 L561.0,316 Z" fill="#52514e"/><text x="870.0" y="384.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="400" >the planner appends the next generation: it labels with the champion&#x27;s games and warm-starts from its weights</text><text x="870.0" y="406.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >(expert iteration); an elected net lands in models/, every verdict in docs/data/generations.json and lineage.tsv</text><text x="40.0" y="474.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >Lanes that ran Parliament jobs: boburner, bosporus, calber, calber-cuda, columbia, jaguaribe, nasser, saskatchewan, saskatchewan-2, whitewolf, xinanjiang.</text><text x="40.0" y="498.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" >The planner runs beside treadcore&#x27;s (multi.py) and keeps at most a few Parliament jobs waiting, so the other projects&#x27; queues barely move.</text></svg>
